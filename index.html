<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LixynHay — Портфолио</title>
  <meta name="description" content="Персональное портфолио инженера и исследователя систем">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22LixynHay%22%2C%22short_name%22%3A%22LH%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fpng%3Bbase64%2CiVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg%3D%3D%22%2C%22sizes%22%3A%221x1%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020617%22%2C%22theme_color%22%3A%22%2360a5fa%22%7D">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.5);
      --secondary: #a855f7;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.light {
      --bg: #f8fafc;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
      --card: rgba(255, 255, 255, 0.8);
      --card-border: rgba(0, 0, 0, 0.1);
      --text: #0f172a;
      --text-secondary: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.3);
      --secondary: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      scroll-behavior: smooth;
      transition: background 0.5s ease, color 0.5s ease;
      overflow-x: hidden;
      min-height: 100vh;
    }
    canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.6; }
    header { padding: 100px 20px 60px; text-align: center; position: relative; }
    header h1 { 
      font-size: clamp(2.5rem, 5vw, 4rem); 
      margin: 0; 
      background: linear-gradient(to right, var(--accent), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 0 30px var(--accent-glow);
    }
    header p { 
      color: var(--text-secondary); 
      font-size: 1.25rem; 
      margin-top: 1rem;
      font-weight: 300;
    }
    nav { 
      display: flex; 
      justify-content: center; 
      gap: 30px; 
      margin: 30px 0 60px; 
      flex-wrap: wrap; 
      background: var(--card);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-radius: 50px;
      border: 1px solid var(--card-border);
      max-width: fit-content;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    nav button { 
      background: transparent; 
      border: none; 
      color: var(--text-secondary); 
      cursor: pointer; 
      font-size: 1rem; 
      font-weight: 600;
      position: relative; 
      transition: var(--transition); 
      padding: 5px 10px;
    }
    nav button:hover, nav button.active { 
      color: var(--accent); 
      text-shadow: 0 0 10px var(--accent-glow);
    }
    nav button::after { 
      content: ""; 
      position: absolute; 
      left: 50%; 
      bottom: -5px; 
      width: 0; 
      height: 2px; 
      background: var(--accent); 
      transition: 0.3s; 
      transform: translateX(-50%);
      box-shadow: 0 0 10px var(--accent);
    }
    nav button:hover::after, nav button.active::after { width: 80%; }
    
    .controls { 
      position: fixed; 
      top: 20px; 
      right: 20px; 
      display: flex; 
      gap: 10px; 
      z-index: 100; 
      background: var(--card);
      backdrop-filter: blur(10px);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    .controls button { 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: 1px solid var(--card-border); 
      background: rgba(255,255,255,0.05); 
      color: var(--text); 
      cursor: pointer; 
      transition: var(--transition); 
      font-size: 0.9rem;
      font-weight: 600;
    }
    .controls button:hover { 
      transform: translateY(-2px); 
      background: var(--accent);
      color: #fff;
      box-shadow: 0 5px 15px var(--accent-glow);
      border-color: var(--accent);
    }
    
    .container { max-width: 1100px; margin: 0 auto 80px; padding: 0 20px; position: relative; z-index: 1; }
    section { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; margin-bottom: 80px; }
    section.visible { opacity: 1; transform: translateY(0); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    
    .card { 
      background: var(--card); 
      backdrop-filter: blur(12px);
      border-radius: 20px; 
      padding: 30px; 
      position: relative; 
      z-index: 1; 
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
      transition: var(--transition); 
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: 0.3s;
    }
    .card:hover { 
      transform: translateY(-8px); 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 30px var(--accent-glow); 
      border-color: var(--accent);
    }
    .card:hover::before { opacity: 1; }
    
    .card h3 { margin-top: 0; color: var(--accent); font-size: 1.4rem; }
    .card ul { padding-left: 20px; color: var(--text-secondary); }
    .card li { margin-bottom: 8px; }
    
    a { color: var(--accent); text-decoration: none; transition: var(--transition); font-weight: 600; }
    a:hover { color: var(--secondary); text-shadow: 0 0 10px var(--accent-glow); }
    
    footer { 
      text-align: center; 
      padding: 40px; 
      color: var(--text-secondary); 
      font-size: 0.9rem; 
      border-top: 1px solid var(--card-border);
      background: rgba(0,0,0,0.2);
    }
    
    .filter { 
      margin-bottom: 30px; 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      flex-wrap: wrap; 
    }
    .filter button { 
      padding: 8px 16px; 
      border-radius: 20px; 
      border: 1px solid var(--card-border); 
      cursor: pointer; 
      background: var(--card); 
      color: var(--text-secondary); 
      transition: var(--transition); 
      font-weight: 500;
    }
    .filter button:hover { border-color: var(--accent); color: var(--text); }
    .filter button.active { 
      background: var(--accent); 
      color: #fff; 
      border-color: var(--accent);
      box-shadow: 0 5px 15px var(--accent-glow);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: var(--transition);
    }
    .stat-card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.05);
      border-color: var(--accent);
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--accent), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Charts Container */
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }
    .chart-wrapper {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--card-border);
      position: relative;
      height: 300px;
    }
    
    /* Project Card Improvements */
    .project-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }
    .project-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .project-lang-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }
    .project-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      flex-grow: 1;
      margin-bottom: 20px;
    }
    .project-stats {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--card-border);
      padding-top: 15px;
    }
    .project-stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    @media (max-width: 768px) {
      header { padding-top: 80px; }
      nav { gap: 15px; padding: 10px 20px; width: 90%; }
      .controls { top: 10px; right: 10px; }
      .stat-value { font-size: 2rem; }
    }
  </style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="controls">
  <button onclick="toggleTheme()" aria-label="Toggle theme">🌓</button>
  <button onclick="setLang('ru')" aria-label="Russian">RU</button>
  <button onclick="setLang('en')" aria-label="English">EN</button>
  <button onclick="downloadCV()" aria-label="Download CV">CV</button>
</div>

<header>
  <h1 id="typed"></h1>
  <p data-ru="Инженер и исследователь систем" data-en="Engineer & Systems Researcher"></p>
</header>

<nav>
  <button onclick="scrollToSection('home')" data-ru="Главная" data-en="Home"></button>
  <button onclick="scrollToSection('about')" data-ru="Обо мне" data-en="About"></button>
  <button onclick="scrollToSection('projects')" data-ru="Проекты" data-en="Projects"></button>
  <button onclick="scrollToSection('links')" data-ru="Контакты" data-en="Contacts"></button>

<div class="container">

        <p data-ru="Глубокое изучение систем, поиск коренной причины проблем, без поверхностного анализа." data-en="Deep system exploration, finding root causes without surface-level analysis."></p>

  <section id="github-stats">
    <div class="card">
      <h3 data-ru="GitHub Статистика" data-en="GitHub Statistics"></h3>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-value" id="repoCount">-</div>
          <div class="stat-label" data-ru="Репозитории" data-en="Repositories"></div>

        <div class="stat-card">
          <div class="stat-value" id="totalStars">-</div>
          <div class="stat-label" data-ru="Всего звёзд" data-en="Total Stars"></div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalForks">-</div>
          <div class="stat-label" data-ru="Форки" data-en="Forks"></div>

      </div>
      <div class="charts-container">
        <div class="chart-wrapper">
          <canvas id="languageChart"></canvas>

  <section id="projects">
    <h2 data-ru="Проекты" data-en="Projects" style="text-align: center; margin-bottom: 30px; font-size: 2rem;"></h2>
    <div class="filter" id="projectFilters"></div>
    <div class="grid" id="projectsGrid"></div>
  </section>

  <section id="links">
    <div class="card">
      <ul>
        <li>🐙 GitHub — <a href="https://github.com/lixynhay" target="_blank" rel="noopener noreferrer">lixynhay</a></li>
        <li>💬 Telegram — @lixynhay</li>
        <li>📧 Email — <a href="mailto:lixynhay@gmail.com">lixynhay@gmail.com</a></li>

</div>

<footer>© <span id="year"></span> • LixynHay</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
  /* ---------- 1. Utils ---------- */
  const $ = q => document.querySelector(q);
  const on = (el, ev, fn) => el.addEventListener(ev, fn);

  /* ---------- 2. Typewriter ---------- */
  const text = "Hi!";
  let i = 0;
  function typeWriter() {
    if (i < text.length) {
      $("#typed").textContent += text.charAt(i);
      i++;
      setTimeout(typeWriter, 120);
    }
  }
  typeWriter();

  /* ---------- 3. Parallax ---------- */
  on(window, "scroll", () => {
    const y = window.scrollY;
    $("header h1").style.transform = `translateY(${y * 0.3}px)`;
    $("header p").style.transform = `translateY(${y * 0.2}px)`;
  });

  /* ---------- 4. Smooth scroll ---------- */
  window.scrollToSection = id => {
    const el = $(`#${id}`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  /* ---------- 5. Language auto + fallback ---------- */
  const RU = "ru", EN = "en";
  function applyLang(lang) {
    const l = (lang === RU || lang === EN) ? lang : RU;
    document.querySelectorAll("[data-ru]").forEach(el => {
      el.textContent = el.dataset[l] || el.dataset.ru;
    });
    localStorage.userLang = l;
  }
  window.setLang = code => applyLang(code);

  async function autoLang() {
    if (localStorage.userLang) {
      applyLang(localStorage.userLang);
      return;
    }
    try {
      const geo = await fetch("https://ipapi.co/json").then(r => r.json());
      const country = geo.country_code;
      if (["US", "GB", "CA", "AU"].includes(country)) {
        applyLang(EN);
        return;
      }
    } catch (e) {}
    const navLang = navigator.language.slice(0, 2).toLowerCase();
    applyLang(navLang === "en" ? EN : RU);
  }
  on(document, "DOMContentLoaded", autoLang);

  /* ---------- 6. Theme ---------- */
  function applyTheme() {
    const stored = localStorage.theme;
    const prefers = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "";
    const theme = stored || prefers;
    document.body.classList.toggle("light", theme === "light");
  }
  window.toggleTheme = () => {
    document.body.classList.toggle("light");
    localStorage.theme = document.body.classList.contains("light") ? "light" : "";
  };
  on(document, "DOMContentLoaded", applyTheme);

  /* ---------- 7. CV ---------- */
  window.downloadCV = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text(`LixynHay\nEngineer & Systems Researcher\n\nSkills:\n- Linux Kernel & Drivers\n- ESP32 / Arduino\n- C / C++ Programming\n- Debugging & Log Analysis\n- Hardware & Soldering\n\nGitHub: github.com/lixynhay`, 10, 10);
    doc.save("LixynHay_CV.pdf");
  };

  /* ---------- 8. GitHub Stats & Projects ---------- */
  const CACHE_KEY = "gh-cache";
  const USER_CACHE_KEY = "gh-user-cache";
  const CACHE_TTL = 1000 * 60 * 10;
  let allRepos = [];
  let userProfile = null;
  let languageChartInstance = null;
  let activityChartInstance = null;

  async function fetchWithCache(key, url, ttl = CACHE_TTL) {
    const cached = sessionStorage.getItem(key);
    if (cached) {
      const { ts, data } = JSON.parse(cached);
      if (Date.now() - ts < ttl) return data;
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    const data = await res.json();
    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
    return data;
  }

  async function loadGitHubData() {
    try {
      // Load user profile
      userProfile = await fetchWithCache(USER_CACHE_KEY, "https://api.github.com/users/lixynhay");
      
      // Load repos
      allRepos = await fetchWithCache(CACHE_KEY, "https://api.github.com/users/lixynhay/repos?per_page=100");
      allRepos = allRepos.filter(r => !r.fork);
      
      // Update stats
      updateStats();
      
      // Create charts
      createCharts();
      
      // Load projects
      populateFilters();
      showProjects();
    } catch (error) {
      console.error("Error loading GitHub data:", error);
      $("#statsGrid").innerHTML = `<p style="text-align:center;color:var(--text-secondary)">Не удалось загрузить данные GitHub. Попробуйте позже.</p>`;
    }
  }

  function updateStats() {
    if (!userProfile) return;
    
    $("#repoCount").textContent = userProfile.public_repos || 0;
    $("#followersCount").textContent = userProfile.followers || 0;
    
    const totalStars = allRepos.reduce((sum, r) => sum + (r.stargazers_count || 0), 0);
    const totalForks = allRepos.reduce((sum, r) => sum + (r.forks_count || 0), 0);
    
    $("#totalStars").textContent = totalStars;
    $("#totalForks").textContent = totalForks;
  }

  function createCharts() {
    // Language distribution chart
    const langCounts = {};
    allRepos.forEach(r => {
      const lang = r.language || "Other";
      langCounts[lang] = (langCounts[lang] || 0) + 1;
    });
    
    const langLabels = Object.keys(langCounts);
    const langData = Object.values(langCounts);
    const colors = [
      '#38bdf8', '#a855f7', '#f472b6', '#fbbf24', '#34d399',
      '#fb923c', '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16'
    ];

    const langCtx = document.getElementById('languageChart').getContext('2d');
    if (languageChartInstance) languageChartInstance.destroy();
    
    languageChartInstance = new Chart(langCtx, {
      type: 'doughnut',
      data: {
        labels: langLabels,
        datasets: [{
          data: langData,
          backgroundColor: colors.slice(0, langLabels.length),
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: getComputedStyle(document.body).getPropertyValue('--text'), padding: 15 }
          },
          title: {
            display: true,
            text: 'Языки программирования',
            color: getComputedStyle(document.body).getPropertyValue('--accent'),
            font: { size: 16, weight: 'bold' }
          }
        }
      }
    });

    // Repository activity chart (last 12 months by creation)
    const now = new Date();
    const monthLabels = [];
    const repoCounts = [];
    
    for (let i = 11; i >= 0; i--) {
      const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const monthName = date.toLocaleString('en-US', { month: 'short' });
      monthLabels.push(monthName);
      
      const reposInMonth = allRepos.filter(r => {
        const created = new Date(r.created_at);
        return created.getMonth() === date.getMonth() && created.getFullYear() === date.getFullYear();
      }).length;
      
      repoCounts.push(reposInMonth);
    }

    const actCtx = document.getElementById('activityChart').getContext('2d');
    if (activityChartInstance) activityChartInstance.destroy();
    
    activityChartInstance = new Chart(actCtx, {
      type: 'bar',
      data: {
        labels: monthLabels,
        datasets: [{
          label: 'Репозитории',
          data: repoCounts,
          backgroundColor: 'rgba(56, 189, 248, 0.7)',
          borderColor: '#38bdf8',
          borderWidth: 1,
          borderRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-secondary') },
            grid: { color: 'rgba(255,255,255,0.05)' }
          },
          x: {
            ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-secondary') },
            grid: { display: false }
          }
        },
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: 'Активность по месяцам',
            color: getComputedStyle(document.body).getPropertyValue('--accent'),
            font: { size: 16, weight: 'bold' }
          }
        }
      }
    });
  }

  function populateFilters() {
    const langs = ["All", ...new Set(allRepos.map(r => r.language).filter(l => l))];
    const filterDiv = $("#projectFilters");
    filterDiv.innerHTML = "";
    langs.forEach((l, idx) => {
      const btn = document.createElement("button");
      btn.textContent = l;
      btn.className = idx === 0 ? "active" : "";
      btn.onclick = () => {
        filterDiv.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        showProjects(l === "All" ? null : l);
      };
      filterDiv.appendChild(btn);
    });
  }

  function showProjects(lang = null) {
    const grid = $("#projectsGrid");
    grid.innerHTML = "";
    allRepos
      .filter(r => !lang || r.language === lang)
      .sort((a, b) => b.stargazers_count - a.stargazers_count)
      .slice(0, 12)
      .forEach(r => {
        const card = document.createElement("div");
        card.className = "card project-card";
        card.innerHTML = `
          <div class="project-header">
            <h4 class="project-title">${r.name}</h4>
            ${r.language ? `<span class="project-lang-badge">${r.language}</span>` : ''}
          </div>
          <p class="project-desc">${r.description || "Без описания"}</p>
          <div class="project-stats">
            <span class="project-stat">⭐ ${r.stargazers_count}</span>
            <span class="project-stat">🍴 ${r.forks_count}</span>
            ${r.homepage ? `<span class="project-stat">🔗 <a href="${r.homepage}" target="_blank">Site</a></span>` : ''}
          </div>
          <div style="margin-top: 15px;">
            <a href="${r.html_url}" target="_blank" rel="noopener noreferrer">Открыть на GitHub →</a>
          </div>
        `;
        grid.appendChild(card);
      });
  }

  loadGitHubData();

  /* ---------- 9. Scroll reveal ---------- */
  const sections = document.querySelectorAll("section");
  const reveal = () => {
    const trigger = window.scrollY + window.innerHeight * 0.75;
    sections.forEach(sec => {
      if (sec.offsetTop < trigger) sec.classList.add("visible");
    });
  };
  on(window, "scroll", reveal);
  reveal();

  /* ---------- 10. Canvas particles (Retina) ---------- */
  const c = $("#bg");
  const ctx = c.getContext("2d");
  let w, h, dpr, particles, mouse = { x: null, y: null };

  on(window, "mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function resize() {
    w = c.clientWidth;
    h = c.clientHeight;
    dpr = window.devicePixelRatio || 1;
    c.width = w * dpr;
    c.height = h * dpr;
    c.style.width = w + "px";
    c.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 1,
      v: Math.random() * 0.6 + 0.2,
      hue: Math.random() * 360
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y += p.v;
      if (p.y > h) p.y = 0;
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const radius = p.r + (dist < 100 ? 20 * (1 - dist / 100) : 0);
      ctx.beginPath();
      ctx.fillStyle = `hsl(${p.hue}, 70%, 60%)`;
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  on(window, "resize", resize);
  resize();
  draw();

  /* ---------- 11. Dynamic year ---------- */
  $("#year").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
